<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="display: none">
  <symbol id="ppf-step-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
